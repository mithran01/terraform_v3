---
- name: Deploy MariaDB StatefulSet on Kubernetes
  hosts: controlplane
  become: true

  vars:

    namespace: openemr

    mariadb_image: mariadb:11.4

    mariadb_database: openemr
    mariadb_user: openemr

    storage_class: gp3
    db_storage_size: 10Gi

    mariadb_resources:
      limits:
        memory: 2Gi
        cpu: "1"

      requests:
        memory: 1Gi
        cpu: "500m"

  tasks:

    # -------------------------------------------------------------------------
    # Create Namespace
    # -------------------------------------------------------------------------

    - name: Create namespace
      shell: kubectl create namespace {{ namespace }}
      failed_when: false
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    # -------------------------------------------------------------------------
    # Check existing secret
    # -------------------------------------------------------------------------

    - name: Check existing MariaDB secret
      shell: |
        kubectl get secret mariadb-secret -n {{ namespace }}
      register: secret_check
      failed_when: false
      changed_when: false
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Set first install flag
      set_fact:
        mariadb_first_install: "{{ secret_check.rc != 0 }}"

    # -------------------------------------------------------------------------
    # Generate passwords only on first install
    # -------------------------------------------------------------------------

    - name: Generate database passwords
      set_fact:
        mariadb_root_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters','digits']) }}"
        mariadb_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters','digits']) }}"
      when: mariadb_first_install

    # -------------------------------------------------------------------------
    # Reuse existing passwords
    # -------------------------------------------------------------------------

    - name: Get existing database password
      shell: |
        kubectl get secret mariadb-secret \
        -n {{ namespace }} \
        -o jsonpath="{.data.database-password}" | base64 -d
      register: existing_db_password
      when: not mariadb_first_install
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Get existing root password
      shell: |
        kubectl get secret mariadb-secret \
        -n {{ namespace }} \
        -o jsonpath="{.data.database-root-password}" | base64 -d
      register: existing_root_password
      when: not mariadb_first_install
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Reuse existing passwords
      set_fact:
        mariadb_password: "{{ existing_db_password.stdout }}"
        mariadb_root_password: "{{ existing_root_password.stdout }}"
      when: not mariadb_first_install

    # -------------------------------------------------------------------------
    # Display credentials only on first install
    # -------------------------------------------------------------------------

    - name: Show generated credentials
      debug:
        msg:
          - "================================="
          - "MariaDB Credentials"
          - "================================="
          - "Database: {{ mariadb_database }}"
          - "User: {{ mariadb_user }}"
          - "Password: {{ mariadb_password }}"
          - "Root Password: {{ mariadb_root_password }}"
          - "================================="
      when: mariadb_first_install

    # -------------------------------------------------------------------------
    # Create Secret
    # -------------------------------------------------------------------------

    - name: Create MariaDB Secret YAML
      copy:
        dest: /tmp/mariadb-secret.yaml
        mode: "0600"
        content: |
          apiVersion: v1
          kind: Secret

          metadata:
            name: mariadb-secret
            namespace: {{ namespace }}

          type: Opaque

          stringData:
            database-name: "{{ mariadb_database }}"
            database-user: "{{ mariadb_user }}"
            database-password: "{{ mariadb_password }}"
            database-root-password: "{{ mariadb_root_password }}"

    - name: Apply MariaDB Secret
      shell: kubectl apply -f /tmp/mariadb-secret.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    # -------------------------------------------------------------------------
    # Headless Service
    # -------------------------------------------------------------------------

    - name: Create MariaDB Headless Service YAML
      copy:
        dest: /tmp/mariadb-headless.yaml
        content: |
          apiVersion: v1
          kind: Service

          metadata:
            name: mariadb
            namespace: {{ namespace }}

          spec:

            clusterIP: None

            selector:
              app: mariadb

            ports:
              - name: mysql
                port: 3306
                targetPort: 3306

    - name: Apply MariaDB Headless Service
      shell: kubectl apply -f /tmp/mariadb-headless.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    # -------------------------------------------------------------------------
    # ClusterIP Service
    # -------------------------------------------------------------------------

    - name: Create MariaDB ClusterIP Service YAML
      copy:
        dest: /tmp/mariadb-clusterip.yaml
        content: |
          apiVersion: v1
          kind: Service

          metadata:
            name: mariadb-clusterip
            namespace: {{ namespace }}

          spec:

            selector:
              app: mariadb

            ports:
              - name: mysql
                port: 3306
                targetPort: 3306

            type: ClusterIP

    - name: Apply MariaDB ClusterIP Service
      shell: kubectl apply -f /tmp/mariadb-clusterip.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    # -------------------------------------------------------------------------
    # StatefulSet
    # -------------------------------------------------------------------------

    - name: Create MariaDB StatefulSet YAML
      copy:
        dest: /tmp/mariadb-statefulset.yaml
        content: |
          apiVersion: apps/v1
          kind: StatefulSet

          metadata:
            name: mariadb
            namespace: {{ namespace }}

          spec:

            serviceName: mariadb

            podManagementPolicy: OrderedReady

            replicas: 1

            selector:
              matchLabels:
                app: mariadb

            template:

              metadata:
                labels:
                  app: mariadb

              spec:

                terminationGracePeriodSeconds: 60

                nodeSelector:
                  role: db

                tolerations:
                  - key: dedicated
                    operator: Equal
                    value: db
                    effect: NoSchedule

                containers:

                  - name: mariadb

                    image: {{ mariadb_image }}

                    imagePullPolicy: IfNotPresent

                    ports:
                      - containerPort: 3306
                        name: mysql

                    env:

                      - name: MYSQL_ROOT_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: mariadb-secret
                            key: database-root-password

                      - name: MYSQL_DATABASE
                        valueFrom:
                          secretKeyRef:
                            name: mariadb-secret
                            key: database-name

                      - name: MYSQL_USER
                        valueFrom:
                          secretKeyRef:
                            name: mariadb-secret
                            key: database-user

                      - name: MYSQL_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: mariadb-secret
                            key: database-password

                    volumeMounts:
                      - name: mariadb-data
                        mountPath: /var/lib/mysql

                    livenessProbe:
                      tcpSocket:
                        port: 3306
                      initialDelaySeconds: 60
                      periodSeconds: 20

                    readinessProbe:
                      tcpSocket:
                        port: 3306
                      initialDelaySeconds: 20
                      periodSeconds: 10

                    resources:
                      requests:
                        memory: "{{ mariadb_resources.requests.memory }}"
                        cpu: "{{ mariadb_resources.requests.cpu }}"

                      limits:
                        memory: "{{ mariadb_resources.limits.memory }}"
                        cpu: "{{ mariadb_resources.limits.cpu }}"

            volumeClaimTemplates:

              - metadata:
                  name: mariadb-data

                spec:

                  accessModes:
                    - ReadWriteOnce

                  storageClassName: {{ storage_class }}

                  resources:
                    requests:
                      storage: {{ db_storage_size }}

    - name: Apply MariaDB StatefulSet
      shell: kubectl apply -f /tmp/mariadb-statefulset.yaml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    # -------------------------------------------------------------------------
    # Wait
    # -------------------------------------------------------------------------

    - name: Wait for MariaDB Pod
      shell: |
        kubectl wait \
        --for=condition=Ready \
        pod/mariadb-0 \
        -n {{ namespace }} \
        --timeout=600s
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    # -------------------------------------------------------------------------
    # Verification
    # -------------------------------------------------------------------------

    - name: Show StatefulSet
      shell: kubectl get sts -n {{ namespace }}
      register: mariadb_sts
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - debug:
        var: mariadb_sts.stdout

    - name: Show PVC
      shell: kubectl get pvc -n {{ namespace }}
      register: mariadb_pvc
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - debug:
        var: mariadb_pvc.stdout

    - name: Show PV
      shell: kubectl get pv
      register: mariadb_pv
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - debug:
        var: mariadb_pv.stdout

    - name: Show Pod Placement
      shell: kubectl get pods -n {{ namespace }} -o wide
      register: mariadb_pods
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - debug:
        var: mariadb_pods.stdout