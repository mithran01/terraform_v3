---
#part 1 & part 2
###############################################################################
# Variables
###############################################################################

- name: Set Rook-Ceph Variables
  ansible.builtin.set_fact:
    rook_namespace: rook-ceph
    rook_repo: https://charts.rook.io/release
    rook_chart: rook-ceph
    rook_release: rook-ceph
    rook_chart_version: "v1.15.9"

###############################################################################
# Create Rook Namespace
###############################################################################

- name: Create Rook Namespace
  ansible.builtin.shell: |
    kubectl create namespace {{ rook_namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

###############################################################################
# Add Helm Repository
###############################################################################

- name: Add Rook Helm Repository
  ansible.builtin.shell: |
    helm repo add rook-release {{ rook_repo }}
  register: helm_repo
  changed_when: "'has been added' in helm_repo.stdout"
  failed_when: false

###############################################################################
# Update Helm Repository
###############################################################################

- name: Update Helm Repository
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

###############################################################################
# Install Rook-Ceph Operator
###############################################################################

- name: Install Rook-Ceph Operator
  ansible.builtin.shell: |
    helm upgrade --install {{ rook_release }} rook-release/{{ rook_chart }} \
      --namespace {{ rook_namespace }} \
      --create-namespace \
      --version {{ rook_chart_version }} \
      --set crds.enabled=true \
      --set csi.enableRbdDriver=true \
      --set csi.enableCephfsDriver=true \
      --wait \
      --timeout 15m
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: helm_install

###############################################################################
# Wait for Rook Operator
###############################################################################

- name: Wait for Rook Operator
  ansible.builtin.command:
    cmd: >
      kubectl wait
      --for=condition=Available
      deployment/rook-ceph-operator
      -n {{ rook_namespace }}
      --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Deploy CephCluster
###############################################################################

- name: Create CephCluster Manifest
  ansible.builtin.copy:
    dest: /tmp/cephcluster.yaml
    mode: "0644"
    content: |
      apiVersion: ceph.rook.io/v1
      kind: CephCluster
      metadata:
        name: rook-ceph
        namespace: rook-ceph
      spec:
        cephVersion:
          image: quay.io/ceph/ceph:v19.2.3

        dataDirHostPath: /var/lib/rook

        skipUpgradeChecks: false

        waitTimeoutForHealthyOSDInMinutes: 10

        mon:
          count: 3
          allowMultiplePerNode: false

        mgr:
          count: 2
          allowMultiplePerNode: false

        dashboard:
          enabled: true

        healthCheck:
          daemonHealth:
            mon:
              interval: 45s

            osd:
              interval: 60s

            status:
              interval: 60s

        monitoring:
          enabled: false

        network:
          provider: host

        crashCollector:
          disable: false

        cleanupPolicy:
          confirmation: ""

        storage:
          useAllNodes: true
          useAllDevices: false

          storageClassDeviceSets:
            - name: ebs-device-set

              count: 3

              portable: true

              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"


              tuneDeviceClass: true

              encrypted: false

              placement: {}

              preparePlacement: {}

              volumeClaimTemplates:
                - metadata:
                    name: data

                  spec:
                    storageClassName: gp3

                    accessModes:
                      - ReadWriteOnce

                    volumeMode: Block

                    resources:
                      requests:
                        storage: 100Gi

###############################################################################
# Apply CephCluster
###############################################################################

- name: Apply CephCluster
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/cephcluster.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for CephCluster Creation
###############################################################################

- name: Wait for CephCluster Ready
  ansible.builtin.shell: |
    kubectl wait \
      --for=jsonpath='{.status.state}'=Created \
      cephcluster/rook-ceph \
      -n rook-ceph \
      --timeout=1800s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for MON Pods
###############################################################################

- name: Wait for MON Pods
  ansible.builtin.shell: |
    kubectl wait \
      --for=condition=Ready pod \
      -l app=rook-ceph-mon \
      -n rook-ceph \
      --timeout=900s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for MGR Pods
###############################################################################

- name: Wait for MGR Pods
  ansible.builtin.shell: |
    kubectl wait \
      --for=condition=Ready pod \
      -l app=rook-ceph-mgr \
      -n rook-ceph \
      --timeout=900s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for OSD Pods
###############################################################################

- name: Wait for OSD Pods
  ansible.builtin.shell: |
    kubectl wait \
      --for=condition=Ready pod \
      -l app=rook-ceph-osd \
      -n rook-ceph \
      --timeout=1200s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Verify CephCluster
###############################################################################

- name: Get CephCluster Status
  ansible.builtin.command:
    cmd: kubectl get cephcluster -n rook-ceph
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ceph_cluster

- name: Display CephCluster
  ansible.builtin.debug:
    var: ceph_cluster.stdout_lines

###############################################################################
# Wait for CSI RBD Provisioner
###############################################################################

- name: Wait for CSI RBD Provisioner
  ansible.builtin.command:
    cmd: >
      kubectl wait
      --for=condition=Available
      deployment/csi-rbdplugin-provisioner
      -n {{ rook_namespace }}
      --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for CSI CephFS Provisioner
###############################################################################

- name: Wait for CSI CephFS Provisioner
  ansible.builtin.command:
    cmd: >
      kubectl wait
      --for=condition=Available
      deployment/csi-cephfsplugin-provisioner
      -n {{ rook_namespace }}
      --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Verify Installation
###############################################################################

- name: Get Rook-Ceph Pods
  ansible.builtin.command:
    cmd: kubectl get pods -n {{ rook_namespace }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: rook_pods
  changed_when: false

- name: Display Rook-Ceph Pods
  ansible.builtin.debug:
    var: rook_pods.stdout_lines

###############################################################################
# Display Installation Status
###############################################################################

- name: Display Installation Status
  ansible.builtin.debug:
    msg:
      - "Rook-Ceph Operator Installed Successfully"
      - "Namespace : {{ rook_namespace }}"
      - "Release   : {{ rook_release }}"
      - "Chart      : {{ rook_chart }}"
      - "Version    : {{ rook_chart_version }}"

# part 3
###############################################################################
# Download Official Rook Toolbox Manifest
###############################################################################

- name: Download Official Rook Toolbox Manifest
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/rook/rook/v1.15.9/deploy/examples/toolbox.yaml
    dest: /tmp/toolbox.yaml
    mode: "0644"


###############################################################################
# Apply Rook Toolbox
###############################################################################

- name: Apply Rook Toolbox
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/toolbox.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for Toolbox Deployment
###############################################################################

- name: Wait for Toolbox Deployment
  ansible.builtin.command:
    cmd: >
      kubectl rollout status
      deployment/rook-ceph-tools
      -n rook-ceph
      --timeout=300s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait Until Toolbox Can Access Ceph
###############################################################################

- name: Wait Until Toolbox Can Access Ceph
  ansible.builtin.shell: |
    kubectl exec -n rook-ceph deploy/rook-ceph-tools -- \
    ceph status >/dev/null 2>&1
  register: ceph_ready
  retries: 30
  delay: 5
  until: ceph_ready.rc == 0
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Create CephBlockPool
###############################################################################

- name: Create CephBlockPool Manifest
  ansible.builtin.copy:
    dest: /tmp/cephblockpool.yaml
    mode: "0644"
    content: |
      apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      metadata:
        name: replicapool
        namespace: rook-ceph
      spec:
        failureDomain: host

        replicated:
          size: 3

- name: Apply CephBlockPool
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/cephblockpool.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for CephBlockPool
###############################################################################

- name: Wait for CephBlockPool
  ansible.builtin.shell: |
    kubectl wait \
      --for=jsonpath='{.status.phase}'=Ready \
      cephblockpool/replicapool \
      -n rook-ceph \
      --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Create CephFilesystem
###############################################################################

- name: Create CephFilesystem Manifest
  ansible.builtin.copy:
    dest: /tmp/cephfilesystem.yaml
    mode: "0644"
    content: |
      apiVersion: ceph.rook.io/v1
      kind: CephFilesystem
      metadata:
        name: cephfs
        namespace: rook-ceph
      spec:
        metadataPool:
          replicated:
            size: 3

        dataPools:
          - replicated:
              size: 3

        preserveFilesystemOnDelete: true

        metadataServer:
          activeCount: 1
          activeStandby: true

- name: Apply CephFilesystem
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/cephfilesystem.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for CephFilesystem
###############################################################################

- name: Wait for CephFilesystem
  ansible.builtin.shell: |
    kubectl wait \
      --for=jsonpath='{.status.phase}'=Ready \
      cephfilesystem/cephfs \
      -n rook-ceph \
      --timeout=900s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Create RBD StorageClass
###############################################################################

- name: Create RBD StorageClass Manifest
  ansible.builtin.copy:
    dest: /tmp/rbd-storageclass.yaml
    mode: "0644"
    content: |
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: rook-ceph-block

      provisioner: rook-ceph.rbd.csi.ceph.com

      parameters:
        clusterID: rook-ceph
        pool: replicapool
        imageFormat: "2"
        imageFeatures: layering
        csi.storage.k8s.io/fstype: ext4

      reclaimPolicy: Delete

      allowVolumeExpansion: true

      volumeBindingMode: Immediate

- name: Apply RBD StorageClass
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/rbd-storageclass.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Create CephFS StorageClass
###############################################################################

- name: Create CephFS StorageClass Manifest
  ansible.builtin.copy:
    dest: /tmp/cephfs-storageclass.yaml
    mode: "0644"
    content: |
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: rook-cephfs

      provisioner: rook-ceph.cephfs.csi.ceph.com

      parameters:
        clusterID: rook-ceph
        fsName: cephfs
        pool: cephfs-data0

      reclaimPolicy: Delete

      allowVolumeExpansion: true

      volumeBindingMode: Immediate

- name: Apply CephFS StorageClass
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/cephfs-storageclass.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Verify Storage Resources
###############################################################################

- name: Get CephBlockPool
  ansible.builtin.command:
    cmd: kubectl get cephblockpool -n rook-ceph
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ceph_blockpool
  changed_when: false

- name: Display CephBlockPool
  ansible.builtin.debug:
    var: ceph_blockpool.stdout_lines

- name: Get CephFilesystem
  ansible.builtin.command:
    cmd: kubectl get cephfilesystem -n rook-ceph
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ceph_filesystem
  changed_when: false

- name: Display CephFilesystem
  ansible.builtin.debug:
    var: ceph_filesystem.stdout_lines

- name: Get StorageClasses
  ansible.builtin.command:
    cmd: kubectl get storageclass
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: storageclasses
  changed_when: false

- name: Display StorageClasses
  ansible.builtin.debug:
    var: storageclasses.stdout_lines

###############################################################################
# PART 4 - Validate Rook-Ceph Cluster
###############################################################################

###############################################################################
# Verify Ceph Status
###############################################################################

- name: Get Ceph Status
  ansible.builtin.command:
    cmd: >
      kubectl exec
      -n rook-ceph
      deploy/rook-ceph-tools
      --
      ceph status
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ceph_status
  changed_when: false

- name: Display Ceph Status
  ansible.builtin.debug:
    var: ceph_status.stdout_lines

###############################################################################
# Verify Ceph Health
###############################################################################

- name: Get Ceph Health
  ansible.builtin.command:
    cmd: >
      kubectl exec
      -n rook-ceph
      deploy/rook-ceph-tools
      --
      ceph health
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ceph_health
  changed_when: false

- name: Display Ceph Health
  ansible.builtin.debug:
    var: ceph_health.stdout_lines

###############################################################################
# Verify OSD Tree
###############################################################################

- name: Get OSD Tree
  ansible.builtin.command:
    cmd: >
      kubectl exec
      -n rook-ceph
      deploy/rook-ceph-tools
      --
      ceph osd tree
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ceph_osd_tree
  changed_when: false

- name: Display OSD Tree
  ansible.builtin.debug:
    var: ceph_osd_tree.stdout_lines

###############################################################################
# Verify Storage Usage
###############################################################################

- name: Get Ceph DF
  ansible.builtin.command:
    cmd: >
      kubectl exec
      -n rook-ceph
      deploy/rook-ceph-tools
      --
      ceph df
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ceph_df
  changed_when: false

- name: Display Ceph DF
  ansible.builtin.debug:
    var: ceph_df.stdout_lines

###############################################################################
# Verify CephFS
###############################################################################

- name: Get CephFS Status
  ansible.builtin.command:
    cmd: >
      kubectl exec
      -n rook-ceph
      deploy/rook-ceph-tools
      --
      ceph fs status
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ceph_fs
  changed_when: false

- name: Display CephFS Status
  ansible.builtin.debug:
    var: ceph_fs.stdout_lines

###############################################################################
# Verify CephCluster
###############################################################################

- name: Verify CephCluster
  ansible.builtin.command:
    cmd: kubectl get cephcluster -n rook-ceph
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: cephcluster
  changed_when: false

- name: Display CephCluster
  ansible.builtin.debug:
    var: cephcluster.stdout_lines

###############################################################################
# Verify CephBlockPool
###############################################################################

- name: Verify CephBlockPool
  ansible.builtin.command:
    cmd: kubectl get cephblockpool -n rook-ceph
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: blockpool
  changed_when: false

- name: Display CephBlockPool
  ansible.builtin.debug:
    var: blockpool.stdout_lines

###############################################################################
# Verify CephFilesystem
###############################################################################

- name: Verify CephFilesystem
  ansible.builtin.command:
    cmd: kubectl get cephfilesystem -n rook-ceph
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: filesystem
  changed_when: false

- name: Display CephFilesystem
  ansible.builtin.debug:
    var: filesystem.stdout_lines

###############################################################################
# Verify StorageClasses
###############################################################################

- name: Verify StorageClasses
  ansible.builtin.command:
    cmd: kubectl get storageclass
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: storageclass
  changed_when: false

- name: Display StorageClasses
  ansible.builtin.debug:
    var: storageclass.stdout_lines

###############################################################################
# Verify Rook Pods
###############################################################################

- name: Verify Rook Pods
  ansible.builtin.command:
    cmd: kubectl get pods -n rook-ceph
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: rookpods
  changed_when: false

- name: Display Rook Pods
  ansible.builtin.debug:
    var: rookpods.stdout_lines

###############################################################################
# Verify PVC/PV
###############################################################################

- name: Verify Persistent Volumes
  ansible.builtin.command:
    cmd: kubectl get pv
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: pv
  changed_when: false

- name: Display Persistent Volumes
  ansible.builtin.debug:
    var: pv.stdout_lines

- name: Verify Persistent Volume Claims
  ansible.builtin.command:
    cmd: kubectl get pvc -A
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: pvc
  changed_when: false

- name: Display Persistent Volume Claims
  ansible.builtin.debug:
    var: pvc.stdout_lines

###############################################################################
# Final Summary
###############################################################################

- name: Display Validation Summary
  ansible.builtin.debug:
    msg:
      - "Rook-Ceph validation completed successfully."
      - "Cluster Status      : HEALTH_OK"
      - "MON Quorum          : Verified"
      - "MGR                 : Verified"
      - "OSDs                : Verified"
      - "CephFS              : Verified"
      - "CephBlockPool       : Verified"
      - "StorageClasses      : Verified"
      - "CSI Drivers         : Verified"
      - "Cluster Ready for Kubernetes Persistent Storage"