---
#part 1 & part 2
###############################################################################
# Variables
###############################################################################

- name: Set Rook-Ceph Variables
  ansible.builtin.set_fact:
    rook_namespace: rook-ceph
    rook_repo: https://charts.rook.io/release
    rook_chart: rook-ceph
    rook_release: rook-ceph
    rook_chart_version: "v1.15.9"

###############################################################################
# Create Rook Namespace
###############################################################################

- name: Create Rook Namespace
  ansible.builtin.shell: |
    kubectl create namespace {{ rook_namespace }} \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false

###############################################################################
# Add Helm Repository
###############################################################################

- name: Add Rook Helm Repository
  ansible.builtin.shell: |
    helm repo add rook-release {{ rook_repo }}
  register: helm_repo
  changed_when: "'has been added' in helm_repo.stdout"
  failed_when: false

###############################################################################
# Update Helm Repository
###############################################################################

- name: Update Helm Repository
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

###############################################################################
# Install Rook-Ceph Operator
###############################################################################

- name: Install Rook-Ceph Operator
  ansible.builtin.shell: |
    helm upgrade --install {{ rook_release }} rook-release/{{ rook_chart }} \
      --namespace {{ rook_namespace }} \
      --create-namespace \
      --version {{ rook_chart_version }} \
      --set crds.enabled=true \
      --set csi.enableRbdDriver=true \
      --set csi.enableCephfsDriver=true \
      --wait \
      --timeout 15m
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: helm_install

###############################################################################
# Wait for Rook Operator
###############################################################################

- name: Wait for Rook Operator
  ansible.builtin.command:
    cmd: >
      kubectl wait
      --for=condition=Available
      deployment/rook-ceph-operator
      -n {{ rook_namespace }}
      --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Deploy CephCluster
###############################################################################

- name: Create CephCluster Manifest
  ansible.builtin.copy:
    dest: /tmp/cephcluster.yaml
    mode: "0644"
    content: |
      apiVersion: ceph.rook.io/v1
      kind: CephCluster
      metadata:
        name: rook-ceph
        namespace: rook-ceph
      spec:
        cephVersion:
          image: quay.io/ceph/ceph:v19.2.3

        dataDirHostPath: /var/lib/rook

        skipUpgradeChecks: false

        waitTimeoutForHealthyOSDInMinutes: 10

        mon:
          count: 3
          allowMultiplePerNode: false

        mgr:
          count: 2
          allowMultiplePerNode: false

        dashboard:
          enabled: true

        healthCheck:
          daemonHealth:
            mon:
              interval: 45s

            osd:
              interval: 60s

            status:
              interval: 60s

        monitoring:
          enabled: false

        network:
          provider: host

        crashCollector:
          disable: false

        cleanupPolicy:
          confirmation: ""

        storage:
          useAllNodes: true
          useAllDevices: false

          storageClassDeviceSets:
            - name: ebs-device-set

              count: 3

              portable: true

              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"


              tuneDeviceClass: true

              encrypted: false

              placement: {}

              preparePlacement: {}

              volumeClaimTemplates:
                - metadata:
                    name: data

                  spec:
                    storageClassName: gp3

                    accessModes:
                      - ReadWriteOnce

                    volumeMode: Block

                    resources:
                      requests:
                        storage: 100Gi

###############################################################################
# Apply CephCluster
###############################################################################

- name: Apply CephCluster
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/cephcluster.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for CephCluster Creation
###############################################################################

- name: Wait for CephCluster Ready
  ansible.builtin.shell: |
    kubectl wait \
      --for=jsonpath='{.status.state}'=Created \
      cephcluster/rook-ceph \
      -n rook-ceph \
      --timeout=1800s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for MON Pods
###############################################################################

- name: Wait for MON Pods
  ansible.builtin.shell: |
    kubectl wait \
      --for=condition=Ready pod \
      -l app=rook-ceph-mon \
      -n rook-ceph \
      --timeout=900s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for MGR Pods
###############################################################################

- name: Wait for MGR Pods
  ansible.builtin.shell: |
    kubectl wait \
      --for=condition=Ready pod \
      -l app=rook-ceph-mgr \
      -n rook-ceph \
      --timeout=900s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for OSD Pods
###############################################################################

- name: Wait for OSD Pods
  ansible.builtin.shell: |
    kubectl wait \
      --for=condition=Ready pod \
      -l app=rook-ceph-osd \
      -n rook-ceph \
      --timeout=1200s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Verify CephCluster
###############################################################################

- name: Get CephCluster Status
  ansible.builtin.command:
    cmd: kubectl get cephcluster -n rook-ceph
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ceph_cluster

- name: Display CephCluster
  ansible.builtin.debug:
    var: ceph_cluster.stdout_lines

###############################################################################
# Wait for CSI RBD Provisioner
###############################################################################

- name: Wait for CSI RBD Provisioner
  ansible.builtin.command:
    cmd: >
      kubectl wait
      --for=condition=Available
      deployment/csi-rbdplugin-provisioner
      -n {{ rook_namespace }}
      --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for CSI CephFS Provisioner
###############################################################################

- name: Wait for CSI CephFS Provisioner
  ansible.builtin.command:
    cmd: >
      kubectl wait
      --for=condition=Available
      deployment/csi-cephfsplugin-provisioner
      -n {{ rook_namespace }}
      --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Verify Installation
###############################################################################

- name: Get Rook-Ceph Pods
  ansible.builtin.command:
    cmd: kubectl get pods -n {{ rook_namespace }}
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: rook_pods
  changed_when: false

- name: Display Rook-Ceph Pods
  ansible.builtin.debug:
    var: rook_pods.stdout_lines

###############################################################################
# Display Installation Status
###############################################################################

- name: Display Installation Status
  ansible.builtin.debug:
    msg:
      - "Rook-Ceph Operator Installed Successfully"
      - "Namespace : {{ rook_namespace }}"
      - "Release   : {{ rook_release }}"
      - "Chart      : {{ rook_chart }}"
      - "Version    : {{ rook_chart_version }}"

# part 3
###############################################################################
# Deploy Rook Toolbox
###############################################################################

- name: Create Rook Toolbox Manifest
  ansible.builtin.copy:
    dest: /tmp/rook-toolbox.yaml
    mode: "0644"
    content: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rook-ceph-tools
        namespace: rook-ceph
        labels:
          app: rook-ceph-tools
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: rook-ceph-tools
        template:
          metadata:
            labels:
              app: rook-ceph-tools
          spec:
            dnsPolicy: ClusterFirstWithHostNet
            serviceAccountName: rook-ceph-default
            containers:
              - name: rook-ceph-tools
                image: quay.io/ceph/ceph:v19.2.3
                command:
                  - /bin/bash
                  - -c
                  - sleep infinity
                securityContext:
                  privileged: true
                volumeMounts:
                  - name: mon-endpoint-volume
                    mountPath: /etc/rook
            volumes:
              - name: mon-endpoint-volume
                configMap:
                  name: rook-ceph-mon-endpoints

- name: Apply Rook Toolbox
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/rook-toolbox.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for Toolbox
###############################################################################

- name: Wait for Toolbox
  ansible.builtin.command:
    cmd: >
      kubectl wait
      --for=condition=Available
      deployment/rook-ceph-tools
      -n rook-ceph
      --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Create CephBlockPool
###############################################################################

- name: Create CephBlockPool Manifest
  ansible.builtin.copy:
    dest: /tmp/cephblockpool.yaml
    mode: "0644"
    content: |
      apiVersion: ceph.rook.io/v1
      kind: CephBlockPool
      metadata:
        name: replicapool
        namespace: rook-ceph
      spec:
        failureDomain: host

        replicated:
          size: 3

- name: Apply CephBlockPool
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/cephblockpool.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for CephBlockPool
###############################################################################

- name: Wait for CephBlockPool
  ansible.builtin.shell: |
    kubectl wait \
      --for=jsonpath='{.status.phase}'=Ready \
      cephblockpool/replicapool \
      -n rook-ceph \
      --timeout=600s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Create CephFilesystem
###############################################################################

- name: Create CephFilesystem Manifest
  ansible.builtin.copy:
    dest: /tmp/cephfilesystem.yaml
    mode: "0644"
    content: |
      apiVersion: ceph.rook.io/v1
      kind: CephFilesystem
      metadata:
        name: cephfs
        namespace: rook-ceph
      spec:
        metadataPool:
          replicated:
            size: 3

        dataPools:
          - replicated:
              size: 3

        preserveFilesystemOnDelete: true

        metadataServer:
          activeCount: 1
          activeStandby: true

- name: Apply CephFilesystem
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/cephfilesystem.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Wait for CephFilesystem
###############################################################################

- name: Wait for CephFilesystem
  ansible.builtin.shell: |
    kubectl wait \
      --for=jsonpath='{.status.phase}'=Ready \
      cephfilesystem/cephfs \
      -n rook-ceph \
      --timeout=900s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Create RBD StorageClass
###############################################################################

- name: Create RBD StorageClass Manifest
  ansible.builtin.copy:
    dest: /tmp/rbd-storageclass.yaml
    mode: "0644"
    content: |
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: rook-ceph-block

      provisioner: rook-ceph.rbd.csi.ceph.com

      parameters:
        clusterID: rook-ceph
        pool: replicapool
        imageFormat: "2"
        imageFeatures: layering
        csi.storage.k8s.io/fstype: ext4

      reclaimPolicy: Delete

      allowVolumeExpansion: true

      volumeBindingMode: Immediate

- name: Apply RBD StorageClass
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/rbd-storageclass.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Create CephFS StorageClass
###############################################################################

- name: Create CephFS StorageClass Manifest
  ansible.builtin.copy:
    dest: /tmp/cephfs-storageclass.yaml
    mode: "0644"
    content: |
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: rook-cephfs

      provisioner: rook-ceph.cephfs.csi.ceph.com

      parameters:
        clusterID: rook-ceph
        fsName: cephfs
        pool: cephfs-data0

      reclaimPolicy: Delete

      allowVolumeExpansion: true

      volumeBindingMode: Immediate

- name: Apply CephFS StorageClass
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/cephfs-storageclass.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

###############################################################################
# Verify Storage Resources
###############################################################################

- name: Get CephBlockPool
  ansible.builtin.command:
    cmd: kubectl get cephblockpool -n rook-ceph
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ceph_blockpool
  changed_when: false

- name: Display CephBlockPool
  ansible.builtin.debug:
    var: ceph_blockpool.stdout_lines

- name: Get CephFilesystem
  ansible.builtin.command:
    cmd: kubectl get cephfilesystem -n rook-ceph
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ceph_filesystem
  changed_when: false

- name: Display CephFilesystem
  ansible.builtin.debug:
    var: ceph_filesystem.stdout_lines

- name: Get StorageClasses
  ansible.builtin.command:
    cmd: kubectl get storageclass
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: storageclasses
  changed_when: false

- name: Display StorageClasses
  ansible.builtin.debug:
    var: storageclasses.stdout_lines