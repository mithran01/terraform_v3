---
# ---------------------------------------------------------
# Add Cilium Helm Repository
# ---------------------------------------------------------

- name: Add Cilium Helm repository
  shell: |
    helm repo add cilium https://helm.cilium.io
    helm repo update
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

# ---------------------------------------------------------
# Install Cilium
# ---------------------------------------------------------

- name: Install Cilium
  shell: |
    helm upgrade --install cilium cilium/cilium \
      --namespace kube-system \
      --create-namespace \
      --version 1.18.1 \
      --set kubeProxyReplacement=false \
      --set operator.replicas=1 \
      --set operator.tolerations[0].key=node-role.kubernetes.io/control-plane \
      --set operator.tolerations[0].operator=Exists \
      --set operator.tolerations[1].key=node-role.kubernetes.io/master \
      --set operator.tolerations[1].operator=Exists \
      --set operator.tolerations[2].key=node.kubernetes.io/not-ready \
      --set operator.tolerations[2].operator=Exists \
      --set operator.tolerations[3].key=node.cloudprovider.kubernetes.io/uninitialized \
      --set operator.tolerations[3].operator=Exists \
      --set operator.tolerations[3].effect=NoSchedule
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

# ---------------------------------------------------------
# Verify Helm Release
# ---------------------------------------------------------

- name: Verify Cilium Helm release
  shell: |
    helm list -n kube-system | grep cilium
  register: cilium_helm
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- debug:
    var: cilium_helm.stdout_lines